[package]
name = "daimon-harness"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "Provider-neutral contracts for bounded agent harness execution"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

[workspace]
members = [".", "sdk/embedded"]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

