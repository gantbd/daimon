[package]
name = "daimon-harness"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "Provider-neutral contracts for bounded agent harness execution"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]

[workspace]
exclude = ["qualification/chronos-attempt"]
members = [
  ".",
  "apps/daimon-local-agent",
  "apps/daimon-local-model",
  "apps/daimon-process-boundary",
  "adapters/daimon-aegis",
  "adapters/daimon-agent-router",
  "adapters/daimon-acp",
  "adapters/daimon-checkpoint",
  "adapters/daimon-claude",
  "adapters/daimon-chronos",
  "adapters/daimon-dendrite",
  "adapters/daimon-local",
  "adapters/daimon-openai-local",
  "crates/daimon-client",
  "crates/daimon-host",
  "crates/daimon-local-daemon",
  "crates/daimon-process",
  "crates/daimon-protocol",
  "crates/daimon-service",
  "crates/daimon-wire",
  "sdk/embedded",
]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

