[package]
name = "daimon-process-boundary"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Owned process-group boundary for governed Daimon terminal callbacks"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
processkit = "3.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
daimon-process = { path = "../../crates/daimon-process" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
