[package]
name = "daimon-chronos"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Public-client Chronos exact-attempt validator for Daimon"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
chronos-client = { path = "../../../chronos/client/chronos-client" }
chronos-protocol = { path = "../../../chronos/protocol/chronos-protocol" }
daimon-host = { path = "../../crates/daimon-host" }
daimon-protocol = { path = "../../crates/daimon-protocol" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
