[package]
name = "daimon-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Bounded ACP subprocess adapter for Daimon interactive agent sessions"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
daimon-host = { path = "../../crates/daimon-host" }
daimon-process = { path = "../../crates/daimon-process" }
daimon-protocol = { path = "../../crates/daimon-protocol" }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
