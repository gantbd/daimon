[package]
name = "daimon-dendrite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Digest-verifying optional Dendrite grounding adapter for Daimon"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
daimon-host = { path = "../../crates/daimon-host" }
daimon-protocol = { path = "../../crates/daimon-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
